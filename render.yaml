services:
  # FastAPI backend — single process, single instance (see CLAUDE.md: the
  # ~2-min Gmail poll and the OAuth pending-flow state are both in-process
  # and in-memory, so this must never be scaled to more than 1 instance).
  - type: web
    name: inbox-to-action-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Real Postgres connection string, set manually in the Render
      # dashboard once an external DB exists — not provisioned here.
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://inbox-to-action-web.onrender.com
      - key: GOOGLE_REDIRECT_URI
        value: https://inbox-to-action-api.onrender.com/auth/google/callback
      - key: GMAIL_POLL_INTERVAL_SECONDS
        value: "120"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_ACCESS_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: USER_TIMEZONE
        sync: false
      - key: NOTION_API_KEY
        sync: false
      - key: NOTION_DATABASE_ID
        sync: false

  # Next.js review UI.
  - type: web
    name: inbox-to-action-web
    runtime: node
    plan: free
    buildCommand: cd web && npm install && npm run build
    startCommand: cd web && npm run start -- -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "20.11.1"
      - key: NEXT_PUBLIC_API_URL
        value: https://inbox-to-action-api.onrender.com

  # Public demo pair (security hardening). Same codebase, DEMO_MODE=true:
  # no Gmail/Notion/Calendar calls, a fixed synthetic inbox seeded at
  # startup, and an in-memory fake Notion on approve (app/demo_data.py,
  # app/demo_notion.py). No APP_ACCESS_TOKEN here — DEMO_MODE makes
  # app/auth.py skip the token check entirely, since every write this
  # instance can reach is harmless by construction. The private instance
  # above is unaffected either way: its own APP_ACCESS_TOKEN still fails
  # closed as long as DEMO_MODE is unset there.
  - type: web
    name: inbox-to-action-demo-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # --proxy-headers so app/rate_limit.py's per-IP POST /demo/reset limiter
    # sees each visitor's real IP (from X-Forwarded-For) instead of Render's
    # proxy address for every request — without it, the limiter collapses
    # into one shared 1/min bucket for the whole demo.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DEMO_MODE
        value: "true"
      # SQLite, not Postgres — the demo replays a committed extraction
      # snapshot (app/demo_snapshot.json) instead of hitting a real DB.
      - key: DATABASE_URL
        value: sqlite:///./demo.db
      - key: ALLOWED_ORIGINS
        value: https://inbox-to-action-demo-web.onrender.com

  - type: web
    name: inbox-to-action-demo-web
    runtime: node
    plan: free
    buildCommand: cd web && npm install && npm run build
    startCommand: cd web && npm run start -- -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "20.11.1"
      - key: NEXT_PUBLIC_API_URL
        value: https://inbox-to-action-demo-api.onrender.com
